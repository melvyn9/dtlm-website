name: Deploy preview to GitHub Pages

# Internal preview only, for showing non-technical stakeholders how the site
# currently looks. Production hosting is Cloudflare Pages — see astro.config.mjs
# for how GITHUB_PAGES=true keeps this build isolated from that config.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: withastro/action@v3
        env:
          GITHUB_PAGES: 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
